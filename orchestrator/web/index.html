<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#12100e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Claude Code">
<title>Claude Code Remote</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<!-- Launch screens, so the installed app opens on its own background
     instead of flashing white while the page loads. -->
<link rel="apple-touch-startup-image" href="/splash-1179x2556.png"
      media="(device-width:393px) and (device-height:852px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="/splash-1284x2778.png"
      media="(device-width:428px) and (device-height:926px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="/splash-1170x2532.png"
      media="(device-width:390px) and (device-height:844px) and (-webkit-device-pixel-ratio:3)">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/styles.css?v=13">
</head>
<body>

<header id="topbar">
  <button id="btn-sessions" class="icon-btn" aria-label="Sessions">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
  </button>
  <button id="project-pill" class="pill">
    <span id="project-name">Loading…</span>
    <svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
  </button>
  <div class="grow"></div>
  <button id="btn-new" class="icon-btn" aria-label="New session">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button id="btn-settings" class="icon-btn" aria-label="Settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<main id="thread" aria-live="polite">
  <div id="empty" class="empty">
    <div class="empty-mark">&gt;_</div>
    <h1>Talk to Claude Code</h1>
    <p>Your prompt runs in the folder you pick, on your server, in a real Claude&nbsp;Code session.</p>
  </div>
</main>

<div id="statusbar" class="statusbar" hidden>
  <span class="spinner"></span>
  <span id="status-text">Working…</span>
  <button id="btn-stop" class="ghost-btn">Stop</button>
</div>

<footer id="composer">
  <div class="composer-inner">
    <textarea id="input" rows="1" placeholder="Ask Claude Code…" autocomplete="off"
              autocorrect="off" autocapitalize="sentences" spellcheck="true"></textarea>
    <!-- Dictation. Hidden unless the browser has a speech engine, the same way
         Claude Code hides the mic when the host can't transcribe. -->
    <div id="mic-wrap" class="mic-wrap" hidden>
      <span id="mic-tip" class="mic-tip" aria-hidden="true">Tap or hold to record</span>
      <button id="btn-mic" class="mic-btn" type="button" aria-label="Tap or hold to record">
        <span class="mic-puck"></span>
        <svg viewBox="0 0 24 24">
          <path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/>
          <path d="M19 11a7 7 0 0 1-14 0M12 18v3"/>
        </svg>
      </button>
    </div>
    <button id="btn-send" class="send-btn" aria-label="Send">
      <svg viewBox="0 0 24 24"><path d="M4 12h15M13 6l6 6-6 6"/></svg>
    </button>
  </div>
</footer>

<!-- Sheets -->
<div id="scrim" class="scrim" hidden></div>

<section id="sheet-projects" class="sheet" hidden>
  <div class="sheet-head">
    <h2>Folder</h2>
    <button class="close" data-close>Done</button>
  </div>
  <div id="fb-crumbs" class="crumbs"></div>
  <div id="project-list" class="list"></div>
  <div class="sheet-foot">
    <div class="run-row">
      <label class="sel-wrap">Mode<select id="fb-mode"></select></label>
      <label class="sel-wrap">Model<select id="fb-model"></select></label>
    </div>
    <div class="run-row">
      <label class="sel-wrap">Effort<select id="fb-effort"></select></label>
      <label class="sel-wrap">Tools<select id="fb-profile"></select></label>
    </div>
    <p id="fb-explain" class="hint"></p>
    <div class="foot-row">
      <button id="fb-new" class="ghost-btn">+ New</button>
      <button id="fb-del" class="ghost-btn danger-btn">Delete</button>
      <button id="fb-use" class="primary-btn grow-btn">Open this folder</button>
    </div>
  </div>
</section>

<section id="sheet-sessions" class="sheet tall" hidden>
  <div class="sheet-head"><h2>Conversations</h2><button class="close" data-close>Done</button></div>
  <div class="seg" role="tablist">
    <button id="seg-folder" class="seg-btn sel">This folder</button>
    <button id="seg-all" class="seg-btn">All folders</button>
  </div>
  <div id="session-list" class="list"></div>
  <div class="sheet-foot">
    <button id="sess-new" class="primary-btn">New conversation</button>
  </div>
</section>

<section id="sheet-settings" class="sheet" hidden>
  <div class="sheet-head"><h2>Settings</h2><button class="close" data-close>Done</button></div>
  <div class="form">
    <label>Server
      <input id="cfg-base" type="url" inputmode="url" autocapitalize="off" autocorrect="off"
             placeholder="https://vps.tailnet.ts.net">
    </label>
    <label>Access token
      <input id="cfg-token" type="password" autocapitalize="off" autocorrect="off"
             placeholder="CCR_TOKEN from the server">
    </label>
    <button id="cfg-save" class="primary-btn">Save &amp; connect</button>
    <p id="cfg-status" class="hint"></p>
    <p id="cfg-mode" class="hint mode"></p>
  </div>
</section>

<div id="toast" class="toast" hidden></div>

<script src="/app.js?v=13"></script>
</body>
</html>
